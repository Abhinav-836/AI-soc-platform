# Run from the repository root:
#   docker compose -f docker/docker-compose.yml up --build            -> http://localhost:8080
#   docker compose -f docker/docker-compose.yml --profile elastic up  -> + Elasticsearch & Kibana (:5601)
#
# Set SOC_API_KEY before exposing the port beyond your machine.
services:
  soc:
    build: {context: .., dockerfile: docker/Dockerfile}
    image: ai-soc-platform:latest
    ports:
      - "8080:8080"
      - "5514:5514/udp"        # syslog (enable in config/ingestion.yaml, host 0.0.0.0)
    environment:
      SOC_API_KEY: ${SOC_API_KEY:-}
      SOC_RESPONSE_MODE: dry_run
      ELASTIC_URL: http://elasticsearch:9200
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    volumes:
      - soc-data:/data         # database, logs, model; put log files in /data/raw
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [es-data:/usr/share/elasticsearch/data]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["elastic"]
    ports: ["5601:5601"]
    environment: {ELASTICSEARCH_HOSTS: http://elasticsearch:9200}
    depends_on: [elasticsearch]

volumes:
  soc-data:
  es-data:
