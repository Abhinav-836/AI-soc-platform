# What happens when the platform responds to an alert.
#   dry_run : actions are planned, approved and logged, but nothing is changed
#   enforce : actions really run (firewall rules, EDR/webhook calls)
mode: ${SOC_RESPONSE_MODE:-dry_run}

playbooks_dir: config/playbooks

auto_response:
  enabled: true            # create a response for new alerts that suggest a playbook
  min_severity: high       # ... at or above this severity

approval:
  # action types that wait for an analyst to click Approve (cannot be bypassed by API callers)
  required_for: [block_ip, isolate_host, disable_user]

firewall:
  backend: auto            # auto | windows | iptables | none
  block_duration: 3600     # seconds; 0 = permanent
  allow_private: false     # never block internal (RFC1918) addresses unless true
  protected: []            # extra IPs/CIDRs that must never be blocked (gateways, scanners you own)

edr:
  isolate_webhook: ${EDR_ISOLATE_URL:-}        # POSTed {"action", "target", "response_id"} on isolate_host (enforce)
identity:
  disable_webhook: ${IDENTITY_DISABLE_URL:-}   # same, for disable_user

notifications:
  min_severity: high       # alert notifications at or above this severity
  slack: {enabled: false, webhook_url: "${SLACK_WEBHOOK_URL:-}"}
  teams: {enabled: false, webhook_url: "${TEAMS_WEBHOOK_URL:-}"}
  webhook: {enabled: false, url: "${SOC_WEBHOOK_URL:-}"}
  email:
    enabled: false
    smtp_host: ${SMTP_HOST:-}
    smtp_port: 587
    starttls: true
    username: ${SMTP_USERNAME:-}
    password: ${SMTP_PASSWORD:-}
    from: soc@example.com
    to: [soc-team@example.com]
