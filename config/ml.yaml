model:
  enabled: true
  quantile: 0.999            # per-feature "normal maximum" learned from normal traffic
  margin: 2.0                # how far beyond normal (in IQR units) counts as anomalous
  high_severity_excess: 6.0  # anomaly score at which the alert becomes high severity
  skip_sources: [host]       # not scored until the model is retrained on your own recent events

# Training data: simulated normal traffic by default. To learn YOUR network's
# normal: Detection -> Retrain on recent events (needs 1000+ stored events),
# or: python run.py train --input your_normal_logs.jsonl
