sources:
  file:
    enabled: true
    # Globs allowed. Relative "data/..." paths live in the data folder
    # (SOC_DATA_DIR, default ./data). Add e.g. /var/log/auth.log on Linux.
    paths:
      - data/raw/*.jsonl
      - data/raw/*.log
    start_from: beginning   # for files seen for the first time: beginning | end
    watch_interval: 1

  syslog:
    enabled: false
    host: 127.0.0.1
    port: 5514              # unprivileged; forward with rsyslog: *.* @127.0.0.1:5514
    protocol: udp           # udp | tcp | both

  host:
    enabled: true           # real telemetry from THIS machine: new connections, listening ports, processes
    interval: 5             # seconds between snapshots
    connections: true
    processes: true
    include_cmdline: false  # command lines can contain secrets; off by default

  kafka:
    enabled: false
    bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
    topics: [security-logs]
    group_id: ai-soc-consumer
    auto_offset_reset: latest

parsers:
  json: {enabled: true}
  cef: {enabled: true}
  regex:
    enabled: true
    # Extra named patterns (event_type: regex with named groups); built-in
    # patterns cover sshd, sudo, useradd, iptables/UFW and Apache/Nginx logs.
    patterns: {}
