rules:
  paths: [config/rules]            # YAML rule files (see config/rules/default_rules.yaml)
  custom:
    enabled: true
    rules: []                      # inline rules, same format
  sigma:
    enabled: true
    paths: [config/rules/sigma]

correlation:
  enabled: true
  chains:
    - id: CHAIN-001
      name: Successful login after brute force
      description: A source that was brute-forcing logins then logged in successfully - likely compromised account.
      first: {category: brute_force}
      then_event: {event_type: [ssh_accepted, rdp_accepted, web_auth_success]}
      key: src_ip
      window: 30m
      severity: critical
      mitre: [T1110, T1078]
      response: [block_ip]
    - id: CHAIN-002
      name: Reconnaissance followed by attack
      description: The same source scanned the network and then attacked an application.
      first: {category: reconnaissance}
      then_alert: {category: [web_attack, brute_force]}
      key: src_ip
      window: 30m
      severity: critical
      mitre: [T1595, T1190]
      response: [block_ip]
    - id: CHAIN-003
      name: Infected host talking to known-bad infrastructure
      description: Malware on a host followed by contact with threat-intel indicators or exfiltration.
      first: {category: malware}
      then_alert: {category: [threat_intel, command_and_control, exfiltration]}
      key: hostname
      window: 60m
      severity: critical
      mitre: [T1204, T1071]
      response: [isolate_host]
    - id: CHAIN-004
      name: Credential theft followed by persistence
      first: {category: credential_access}
      then_alert: {category: persistence}
      key: hostname
      window: 30m
      severity: critical
      mitre: [T1003, T1098]
      response: [isolate_host]

intel:
  enabled: true
  files: [config/intel]            # *.csv (type,value,source,confidence,description) or *.txt
  refresh_interval: 21600
  feeds:                           # free public feeds; enable if this machine has internet access
    - name: feodotracker_ips
      enabled: false
      url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
      type: ip
      format: plain
      confidence: 0.9
    - name: urlhaus_domains
      enabled: false
      url: https://urlhaus.abuse.ch/downloads/hostfile/
      type: domain
      format: hostfile
      confidence: 0.8
  abuseipdb: {api_key: "${ABUSEIPDB_API_KEY:-}"}
  virustotal: {api_key: "${VIRUSTOTAL_API_KEY:-}"}

scoring:
  escalate_at: 80
  auto_escalate: true

assets:                            # known hosts raise alert scores when targeted
  hosts:
    - {hostname: db-01, ip: 10.10.2.20, criticality: critical}
    - {hostname: dc-01, ip: 10.10.2.5, criticality: critical}
    - {hostname: web-01, ip: 10.10.2.10, criticality: high}
    - {hostname: bastion-01, ip: 10.10.2.15, criticality: high}
