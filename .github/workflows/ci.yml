name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: flake8 src tests scripts run.py
      - run: pytest -q
      - name: Offline analysis smoke test
        run: |
          python scripts/generate_logs.py --count 500 --attacks 4 --seed 1 --output smoke.jsonl
          python run.py analyze smoke.jsonl
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t ai-soc:ci .
