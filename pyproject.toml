[project]
name = "ai-soc-platform"
version = "2.0.0"
description = "SOC platform: log ingestion, rule/Sigma/threat-intel/ML detection, attack-chain correlation, approval-gated response"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = [
    "fastapi>=0.110,<1", "uvicorn[standard]>=0.29", "pydantic>=2.6,<3", "pyyaml>=6.0.1", "python-dotenv>=1.0",
    "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3", "aiohttp>=3.9", "psutil>=5.9",
]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0.2"]
elastic = ["elasticsearch>=8.9,<9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "flake8>=7"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.6", "pillow>=10.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
